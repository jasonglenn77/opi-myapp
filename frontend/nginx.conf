server {
  listen 80;
  server_name _;

  client_max_body_size 15M;

  root /usr/share/nginx/html;
  index index.html;

  # Compress both static assets and proxied API JSON. The customers/cashflow
  # payloads are large JSON — gzip shrinks them substantially over the wire.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml application/manifest+json;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets aren't content-hashed, so we can't cache-forever (a deploy would go
  # stale). Instead allow caching WITH revalidation: nginx sends an ETag, the
  # browser revalidates, and unchanged files come back as a tiny 304 instead of
  # a full re-download. Far cheaper than the previous no-store (always full body).
  location ~* \.(js|css|svg)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # (Optional) also prevent caching index.html (helps SPA deployments)
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    expires off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
