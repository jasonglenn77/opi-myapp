<!-- Main HTML template for the app. The JS will manage showing/hiding the auth vs shell roots, and injecting content into the shell when logged in. -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OnPoint Installers - App</title>
  <link rel="stylesheet" href="/output.css" />
  <link rel="preload" href="/assets/opi-wordmark-light.webp" as="image" type="image/webp" fetchpriority="high">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div id="app">

    <!-- Login-only root (no header/sidebar, so nothing can flash) -->
    <div id="authRoot" class="h-full min-h-[100vh] overflow-auto flex items-center justify-center px-4"></div>

    <!-- App shell root (header + sidebar + body). Hidden until logged in -->
    <div id="shellRoot" class="min-h-[100vh] hidden">
      <!-- Persistent top bar -->
      <div id="topBar" class="sticky top-0 z-50 border-b border-white/10 bg-ink-900/60 backdrop-blur">
        <div class="w-full px-3 sm:px-4 lg:px-6 2xl:px-10 py-4 flex items-center justify-between gap-3">
          <div id="brandSlot"></div>
          <button id="logoutBtn" class="btn-outline shrink-0">Log out</button>
        </div>
      </div>

      <!-- Persistent shell -->
      <div class="w-full px-3 sm:px-4 lg:px-6 2xl:px-10 py-5 sm:py-6 pb-24 lg:pb-6">
        <!-- Page header -->
        <div class="mb-5">
          <div id="pageTitle" class="text-xl sm:text-2xl lg:text-3xl font-extrabold"></div>
          <div id="pageSubtitle" class="text-white/60 text-sm sm:text-base"></div>
        </div>

        <!-- Sidebar + content -->
        <div class="flex gap-4 lg:gap-6 items-start">
          <aside id="sidebar" class="hidden lg:block shrink-0 sticky" style="width:48px; top:84px; transition: width 0.2s ease;">
            <div class="card overflow-hidden" style="width:100%;">
              <div id="navLabel" class="text-xs font-bold text-black/60 px-3 pt-3 pb-1 whitespace-nowrap overflow-hidden" style="opacity:0; transition: opacity 0.15s ease;">Navigation</div>
              <nav class="py-1">
                <a href="#/projects" data-cap="page.dashboard" class="nav-item flex items-center gap-3 rounded-xl px-3 py-2 hover:bg-black/5 font-semibold overflow-hidden whitespace-nowrap">
                  <svg class="nav-icon shrink-0 w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                  <span class="nav-label" style="opacity:0; transition:opacity 0.15s ease;">Projects</span>
                </a>
                <a href="#/financials" data-cap="page.financials" class="nav-item flex items-center gap-3 rounded-xl px-3 py-2 hover:bg-black/5 font-semibold overflow-hidden whitespace-nowrap">
                  <svg class="nav-icon shrink-0 w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
                  <span class="nav-label" style="opacity:0; transition:opacity 0.15s ease;">Financials</span>
                </a>
                <a href="#/cashflow" data-cap="page.cashflow" class="nav-item flex items-center gap-3 rounded-xl px-3 py-2 hover:bg-black/5 font-semibold overflow-hidden whitespace-nowrap">
                  <svg class="nav-icon shrink-0 w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 10h18M7 15h2m4 0h4M5 6h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2z"/></svg>
                  <span class="nav-label" style="opacity:0; transition:opacity 0.15s ease;">Cash Flow</span>
                </a>
                <a href="#/customers" data-cap="page.customers" class="nav-item flex items-center gap-3 rounded-xl px-3 py-2 hover:bg-black/5 font-semibold overflow-hidden whitespace-nowrap">
                  <svg class="nav-icon shrink-0 w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-3"/><path d="M9 9v.01M9 13v.01M9 17v.01"/></svg>
                  <span class="nav-label" style="opacity:0; transition:opacity 0.15s ease;">Customers</span>
                </a>
                <a href="#/estimate" data-cap="page.estimate" class="nav-item flex items-center gap-3 rounded-xl px-3 py-2 hover:bg-black/5 font-semibold overflow-hidden whitespace-nowrap">

                  <span class="nav-label" style="opacity:0; transition:opacity 0.15s ease;">Estimate</span>
                </a>

                  <span class="nav-label" style="opacity:0; transition:opacity 0.15s ease;">Schedule</span>
                </a>

                  <svg class="nav-icon shrink-0 w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
                  <span class="nav-label" style="opacity:0; transition:opacity 0.15s ease;">Assignment</span>
                </a>
                <a href="#/crew" data-cap="page.crew_portal" class="nav-item flex items-center gap-3 rounded-xl px-3 py-2 hover:bg-black/5 font-semibold overflow-hidden whitespace-nowrap">
                  <svg class="nav-icon shrink-0 w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><circle cx="9" cy="7" r="3"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                  <span class="nav-label" style="opacity:0; transition:opacity 0.15s ease;">Crew Portal</span>
                </a>
                <a href="#/users" data-cap="page.users" class="nav-item flex items-center gap-3 rounded-xl px-3 py-2 hover:bg-black/5 font-semibold overflow-hidden whitespace-nowrap">
                  <svg class="nav-icon shrink-0 w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                  <span class="nav-label" style="opacity:0; transition:opacity 0.15s ease;">Users</span>
                </a>
                <a href="#/teams" data-cap="page.teams" class="nav-item flex items-center gap-3 rounded-xl px-3 py-2 hover:bg-black/5 font-semibold overflow-hidden whitespace-nowrap">
                  <svg class="nav-icon shrink-0 w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5"/><path d="M16 15c2 0 5 1 5 4"/></svg>
                  <span class="nav-label" style="opacity:0; transition:opacity 0.15s ease;">Teams</span>
                </a>
                <a href="#/quickbooks" data-cap="page.quickbooks" class="nav-item flex items-center gap-3 rounded-xl px-3 py-2 hover:bg-black/5 font-semibold overflow-hidden whitespace-nowrap">

                  <span class="nav-label" style="opacity:0; transition:opacity 0.15s ease;">QuickBooks</span>
                </a>
              </nav>
            </div>
          </aside>

          <main id="pageBody" class="flex-1 min-w-0"></main>
        </div>
      </div>

      <!-- Mobile bottom navigation (hidden on lg+ where the sidebar takes over) -->
      <nav id="mobileNav" class="lg:hidden fixed bottom-0 inset-x-0 z-50 bg-ink-900/95 backdrop-blur border-t border-white/10" style="padding-bottom: env(safe-area-inset-bottom);">
        <div class="flex items-stretch">
          <a href="#/projects" data-cap="page.dashboard" class="nav-item flex-1 min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 py-2 text-white/70 hover:text-white active:bg-white/5">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span class="text-[10px] leading-none truncate w-full text-center">Projects</span>
          </a>
          <a href="#/financials" data-cap="page.financials" class="nav-item flex-1 min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 py-2 text-white/70 hover:text-white active:bg-white/5">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
            <span class="text-[10px] leading-none truncate w-full text-center">Financials</span>
          </a>
          <a href="#/estimate" data-cap="page.estimate" class="nav-item flex-1 min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 py-2 text-white/70 hover:text-white active:bg-white/5">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            <span class="text-[10px] leading-none truncate w-full text-center">Estimate</span>

          <a href="#/schedule" data-cap="page.schedule" class="nav-item flex-1 min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 py-2 text-white/70 hover:text-white active:bg-white/5">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span class="text-[10px] leading-none truncate w-full text-center">Schedule</span>
          </a>
          <a href="#/assignment" data-cap="page.assignment" class="nav-item flex-1 min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 py-2 text-white/70 hover:text-white active:bg-white/5">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
            <span class="text-[10px] leading-none truncate w-full text-center">Assign</span>
          </a>
          <button id="mobileNavMoreBtn" type="button" class="flex-1 min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 py-2 text-white/70 hover:text-white active:bg-white/5">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
            <span class="text-[10px] leading-none truncate w-full text-center">More</span>
          </button>
        </div>
      </nav>

      <!-- Mobile nav drawer (slides up from bottom; hidden by default) -->
      <div id="mobileNavDrawer" class="lg:hidden fixed inset-0 z-[60] hidden">
        <div id="mobileNavBackdrop" class="absolute inset-0 bg-black/60 opacity-0 transition-opacity duration-200"></div>
        <div id="mobileNavSheet" class="absolute bottom-0 inset-x-0 bg-ink-900 border-t border-white/10 rounded-t-2xl shadow-soft max-h-[85vh] overflow-y-auto transform translate-y-full transition-transform duration-200" style="padding-bottom: env(safe-area-inset-bottom);">
          <div class="flex items-center justify-between px-4 pt-3 pb-2">
            <div class="text-white font-bold text-sm">Navigation</div>
            <button id="mobileNavCloseBtn" type="button" class="text-white/70 hover:text-white p-1 -mr-1" aria-label="Close menu">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6l-12 12"/></svg>
            </button>
          </div>

          <div class="px-2 pb-2">
            <a href="#/projects" data-cap="page.dashboard" class="nav-item flex items-center gap-3 rounded-xl px-3 py-3 text-white/85 hover:bg-white/5 hover:text-white">
              <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              <span class="font-semibold">Projects</span>
            </a>
            <a href="#/financials" data-cap="page.financials" class="nav-item flex items-center gap-3 rounded-xl px-3 py-3 text-white/85 hover:bg-white/5 hover:text-white">
              <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
              <span class="font-semibold">Financials</span>
            </a>
            <a href="#/cashflow" data-cap="page.cashflow" class="nav-item flex items-center gap-3 rounded-xl px-3 py-3 text-white/85 hover:bg-white/5 hover:text-white">

          <div data-cap-any="page.users,page.teams,page.quickbooks" class="px-4 pt-3 pb-1 text-[11px] uppercase tracking-wider text-white/40 font-bold border-t border-white/10">Settings</div>

</html>
